# Override that `./stack --prod` adds after compose.prod.yml: the production image and the backup service use the
# shared database (deploy/stack/shared-db.yml), like the dev api (deploy/stack/dev.yml).
services:
  app:
    networks: [default, shared]
    depends_on: !reset {}
  backup:
    networks: [default, shared]
    depends_on: !reset {}
