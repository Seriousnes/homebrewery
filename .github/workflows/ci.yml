name: CI

# Fail fast (CLAUDE.md "Tests fail fast", docs/testing.md): there are no long tests and no long
# jobs. Every job has timeout-minutes of 15 at most (setup included); every Playwright run is
# capped at 5 minutes (playwright.config.ts globalTimeout), so each e2e job is one short run (a
# shard, a serial project, the fidelity smoke, the CSP walk) and the shard counts keep each well
# under the cap at CI's 2 workers; the runner scripts kill a run that makes no progress for 60 s.
# The whole e2e suite runs only here; locally the default loop is the unit tests, the specs of the
# area being changed and `npm --prefix web run e2e:smoke` (docs/testing.md, "The lean strategy").
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  web:
    name: Web (lint, typecheck, schema, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The server validates documents against the committed shared/schema-manifest.json; a stale
      # one must fail CI (run `npm --prefix web run schema` and commit the file).
      - name: Schema manifest is up to date
        run: npm run schema -- --check

      - name: Build
        run: npm run build

  # Vitest: 5 s per test, 10 s per hook; the timeout guard (web/scripts/testTimeouts.test.ts) is
  # part of the run.
  unit:
    name: Web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  # End-to-end tests (plan §12): the whole Playwright suite with the API running against the
  # postgres service (migrated on startup), sharded: every spec in Chromium, the editing and
  # pagination specs in Firefox (playwright.config.ts FIREFOX_SPECS). They run in the Playwright
  # image the Linux screenshot baselines were recorded in (same fonts and browsers).
  # web/e2e/matrix/run-suite.mjs starts the API and an isolated Vite, then runs Playwright under
  # its no-progress watchdog. Shards: one Playwright run each, well under the 5-minute cap. The
  # parallel projects take about 1,500 s of test time in Chromium (559 tests) and an estimated
  # 1,100 s in Firefox (166 tests) locally at 6 workers (the 2026-09-26 measurement less the
  # removed tests); at 2 workers and 1.3 times slower that is about 2.3 minutes per shard with 7
  # Chromium and 2 minutes with 6 Firefox shards (up to 1.7 times that for a shard of the slowest
  # folders). Raise the counts when the suite grows (every run prints its test time per project).
  e2e:
    name: E2E ${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.project == 'firefox' && 6 || 7 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: homebrewery
          POSTGRES_PASSWORD: homebrewery
          POSTGRES_DB: homebrewery
        options: >-
          --health-cmd "pg_isready -U homebrewery -d homebrewery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox]
        shard: [1, 2, 3, 4, 5, 6, 7]
        # Firefox has 6 shards.
        exclude:
          - { project: firefox, shard: 7 }
    env:
      # Firefox refuses to start as root with another user's HOME (Playwright's container docs).
      HOME: /root
      HB_E2E_DB_HOST: db
      # dotnet output outside src/ (relative to the repository root, where run-suite.mjs runs dotnet).
      HB_ARTIFACTS: .artifacts
      HB_API_NO_BUILD: "1"
      SHARDS: ${{ matrix.project == 'firefox' && 6 || 7 }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Build the API
        working-directory: .
        run: dotnet build src/Homebrewery.Api --configuration Debug --artifacts-path "$HB_ARTIFACTS"

      # Tests tagged @serial (time budgets) run in the e2e-serial job instead; the import fidelity
      # smoke subset in the fidelity job.
      - name: End-to-end tests
        run: node e2e/matrix/run-suite.mjs --project=${{ matrix.project }} --shard=${{ matrix.shard }}/$SHARDS --grep-invert "S3 import fidelity"

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shard }}
          path: web/blob-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results (traces, screenshots)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.project }}-${{ matrix.shard }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The @serial tests (the S2 30-page budget and the §4.10 performance budgets), one at a time on a
  # quiet runner: about 2 minutes per browser locally (the typing budgets type at a person's pace).
  e2e-serial:
    name: E2E serial ${{ matrix.browser }} (time budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: homebrewery
          POSTGRES_PASSWORD: homebrewery
          POSTGRES_DB: homebrewery
        options: >-
          --health-cmd "pg_isready -U homebrewery -d homebrewery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      HOME: /root
      HB_E2E_DB_HOST: db
      # dotnet output outside src/ (relative to the repository root, where run-suite.mjs runs dotnet).
      HB_ARTIFACTS: .artifacts
      HB_API_NO_BUILD: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Build the API
        working-directory: .
        run: dotnet build src/Homebrewery.Api --configuration Debug --artifacts-path "$HB_ARTIFACTS"

      - name: Serial end-to-end tests (time budgets)
        run: node e2e/matrix/run-suite.mjs --project=${{ matrix.browser }}-serial

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.browser }}-serial
          path: web/blob-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results (perf results, traces)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-serial-results-${{ matrix.browser }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The S3 import fidelity smoke subset (web/e2e/import/fidelity.spec.ts without FIDELITY=all):
  # upstream render vs import, page by page, with its report in the job summary. Chromium only
  # (Firefox runs only the editing specs). The full fidelity run (every fixture) is local only:
  # scripts/fidelity-run.ts.
  fidelity:
    name: Fidelity smoke chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      HOME: /root
      E2E_PORT: "5303"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Playwright starts its own Vite (playwright.config.ts webServer); the runner adds the watchdog.
      - name: Fidelity smoke subset
        run: node e2e/run-playwright.mjs e2e/import/fidelity.spec.ts --project=chromium

      - name: Fidelity report
        if: ${{ !cancelled() }}
        run: |
          npx tsx scripts/fidelity-report.ts --results "test-results/$E2E_PORT/fidelity-results/chromium" --out fidelity-smoke-report.md
          cat fidelity-smoke-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-fidelity-chromium
          path: web/blob-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload fidelity report and images
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: fidelity-smoke-chromium
          path: |
            web/fidelity-smoke-report.md
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The CSP walk (P8.3, web/e2e/security; docs/security.md): a production build served by the API
  # in the Production environment with the enforced Content-Security-Policy, every page walked in
  # Chromium, and any CSP violation fails. web/e2e/security/run-csp.mjs runs `vite build`, starts
  # the API and runs the walk (8 tests) under the runners' watchdog. Not in the e2e shards: it
  # needs its own production host (the specs skip without HB_CSP_E2E).
  csp:
    name: E2E CSP walk (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: homebrewery
          POSTGRES_PASSWORD: homebrewery
          POSTGRES_DB: homebrewery
        options: >-
          --health-cmd "pg_isready -U homebrewery -d homebrewery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOME: /root
      HB_E2E_DB_HOST: db
      # dotnet output outside src/ (relative to the repository root, where run-csp.mjs runs dotnet).
      HB_ARTIFACTS: .artifacts
      HB_API_NO_BUILD: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Build the API
        working-directory: .
        run: dotnet build src/Homebrewery.Api --configuration Debug --artifacts-path "$HB_ARTIFACTS"

      - name: CSP walk
        run: node e2e/security/run-csp.mjs --project=chromium --workers=2

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-csp
          path: web/blob-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results (traces, screenshots)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-csp
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # One HTML report for every e2e job (Playwright blob reports merged).
  e2e-report:
    name: E2E report
    if: ${{ !cancelled() }}
    needs: [e2e, e2e-serial, fidelity, csp]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v7
        with:
          path: web/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into an HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload the HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  dotnet:
    name: .NET (restore, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Homebrewery.slnx

      - name: Build
        run: dotnet build Homebrewery.slnx --no-restore --configuration Release

      # Pdf/PdfRendererTests render with real headless Chromium: the build that the pinned Microsoft.Playwright
      # package expects, installed by that package's own CLI from the build output (docs/testing.md).
      - name: Install Chromium for the PDF tests
        run: pwsh tests/Homebrewery.Api.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps --only-shell chromium

      # API tests use Testcontainers.PostgreSql, which needs the Docker daemon that ubuntu-latest provides.
      # global.json selects Microsoft.Testing.Platform, so VSTest options such as --logger trx are
      # rejected (exit code 5); xunit.v3 writes TRX itself with --report-xunit-trx.
      # The whole run is capped at 5 minutes: the test project passes `--timeout 5m` to the test app
      # (TestingPlatformCommandLineArguments in tests/Homebrewery.Api.Tests/Homebrewery.Api.Tests.csproj),
      # and xunit.runner.json reports any test still running after 10 s.
      - name: Test
        run: dotnet test --solution Homebrewery.slnx --no-build --configuration Release --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14
