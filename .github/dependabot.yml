version: 2
# WYSIWYG fork: the npm project is web/ (the root package.json moved to legacy/, which is reference
# only and gets no updates). NuGet versions are central in Directory.Packages.props.
updates:
- package-ecosystem: npm
  directory: "/web"
  schedule:
    interval: daily
  open-pull-requests-limit: 99
  groups:
    dev-dependencies:
      dependency-type: "development"
      patterns: ["*"]
      update-types: ["patch", "minor"]
    prod-dependencies:
      dependency-type: "production"
      patterns: ["*"]
      update-types: ["patch", "minor"]
  ignore:
  # Exact pin, same version as legacy/package.json, so imported brews parse like upstream (plan §7).
  - dependency-name: marked
  # typescript-eslint 8 supports TypeScript <6.1 and openapi-typescript 7 supports ^5.
  - dependency-name: typescript
    update-types: ["version-update:semver-major"]
- package-ecosystem: nuget
  directory: "/"
  schedule:
    interval: weekly
  groups:
    nuget:
      patterns: ["*"]
      update-types: ["patch", "minor"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
